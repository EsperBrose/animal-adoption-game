<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Adoption Game</title>
  <link rel="stylesheet" href="style.css?v=9">
</head>
<body>
  <canvas id="game"></canvas>
  <h1 class="title">🐾 Animal Adoption Game</h1>

  <div id="picker" class="panel">
    <div id="step-animal">
      <h2>✨ The Magic Pond ✨</h2>
      <p>Step into the pond and turn into any animal you want!</p>
      <div id="animal-grid" class="grid"></div>
      <form id="any-animal" class="row">
        <input id="any-animal-input" placeholder="Or type any animal…" maxlength="24" autocomplete="off">
        <button type="submit" class="big-button">Turn into it!</button>
      </form>
    </div>

    <form id="step-style" hidden>
      <h2 id="style-title">Your animal</h2>
      <label class="field">
        <span>Name</span>
        <input id="name-input" maxlength="16" autocomplete="off">
      </label>
      <div class="field">
        <span>Age</span>
        <div id="age-choices" class="choices"></div>
      </div>
      <div class="field">
        <span>Color</span>
        <div id="swatches" class="swatches"></div>
      </div>
      <div class="row">
        <button type="button" id="back-button" class="plain-button">← Pick another animal</button>
        <button type="submit" class="big-button">Done! 🐾</button>
      </div>
    </form>
  </div>

  <div id="human-panel" class="panel" hidden>
    <h2>🧍 Your human</h2>
    <div class="field">
      <span>I am a…</span>
      <div id="gender-choices" class="choices"></div>
    </div>
    <div class="field">
      <span>Skin</span>
      <div id="skin-swatches" class="swatches"></div>
    </div>
    <div class="field">
      <span>Hair</span>
      <div id="hairstyle-choices" class="choices"></div>
      <div id="hair-swatches" class="swatches"></div>
    </div>
    <div class="field">
      <span>Shirt</span>
      <div id="shirt-swatches" class="swatches"></div>
    </div>
    <div class="field">
      <span>Pants</span>
      <div id="pants-swatches" class="swatches"></div>
    </div>
    <div class="row">
      <button type="button" id="human-cancel" class="plain-button">← Stay an animal</button>
      <button type="button" id="human-done" class="big-button">Done! 🧍</button>
    </div>
  </div>

  <div class="corner-stack">
    <button id="change-animal" class="corner-button" hidden>🔮 Change animal</button>
    <div class="row-right">
      <button id="edit-human" class="small-button" hidden aria-label="Edit your human">✏️</button>
      <button id="form-toggle" class="corner-button form-toggle" hidden>🧍 Human</button>
    </div>
  </div>
  <div id="name-tag" class="name-tag" hidden></div>

  <div id="play-controls" hidden>
    <div class="hint">Walk: arrow keys / WASD, or tap the ground · Hop: Space</div>
    <button id="hop-button" class="hop-button" aria-label="Hop">⤴️</button>
  </div>
  <div id="family-card" class="family-card" hidden>
    <div id="family-title" class="family-title">🏠 Family</div>
    <div class="hearts-bar">
      <div id="hearts-fill" class="hearts-fill"></div>
      <span id="hearts-text" class="hearts-text">❤️ 0 / 100</span>
    </div>
    <div id="family-hint" class="family-hint"></div>
    <div id="family-actions" class="row"></div>
  </div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
  <script src="js/world.js?v=9"></script>
  <script src="js/animals.js?v=9"></script>
  <script src="js/people.js?v=9"></script>
  <script src="js/families.js?v=9"></script>
  <script src="js/effects.js?v=9"></script>
  <script src="js/ui.js?v=9"></script>
  <script src="js/main.js?v=9"></script>
</body>
</html>
