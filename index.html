<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Animal Adoption Game</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf3e7;
      font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
      color: #5a3e2b;
    }
    h1 { margin: 16px 0 8px; }
    canvas {
      max-width: 100%;
      border: 6px solid #8bc34a;
      border-radius: 16px;
      background: #b8e986;
    }
    p { margin: 12px 16px; text-align: center; }
  </style>
</head>
<body>
  <h1>🐾 Animal Adoption Game</h1>
  <canvas id="game" width="800" height="500"></canvas>
  <p>The magic pond is ready... soon you'll be able to turn into any animal! ✨</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    let t = 0;

    function drawTree(x, y) {
      ctx.fillStyle = "#8d6e63";
      ctx.fillRect(x - 6, y, 12, 24);
      ctx.fillStyle = "#4caf50";
      ctx.beginPath();
      ctx.arc(x, y - 6, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      t += 0.03;
      ctx.fillStyle = "#b8e986";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      [[80, 80], [700, 90], [120, 400], [690, 410], [400, 60]].forEach(([x, y]) => drawTree(x, y));

      // Magic pond
      ctx.fillStyle = "#4fc3f7";
      ctx.beginPath();
      ctx.ellipse(400, 260, 160, 90, 0, 0, Math.PI * 2);
      ctx.fill();

      // Sparkles
      for (let i = 0; i < 8; i++) {
        const a = t + (i * Math.PI) / 4;
        const x = 400 + Math.cos(a) * 110;
        const y = 260 + Math.sin(a) * 55;
        ctx.fillStyle = `rgba(255, 255, 255, ${0.5 + 0.5 * Math.sin(t * 3 + i)})`;
        ctx.font = "20px sans-serif";
        ctx.fillText("✨", x - 10, y + 7);
      }

      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 24px 'Trebuchet MS', sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Magic Pond", 400, 268);
      ctx.textAlign = "start";

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
